name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haggle
          POSTGRES_PASSWORD: haggle
          POSTGRES_DB: haggle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haggle" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://haggle:haggle@localhost:5432/haggle
      MANDATE_SIGNING_SECRET: ci-only-secret
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Migrations and seed apply cleanly
        run: pnpm db:migrate && pnpm db:seed
      - run: pnpm build

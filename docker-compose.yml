services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: haggle
      POSTGRES_PASSWORD: haggle
      POSTGRES_DB: haggle
    ports:
      - "5432:5432"
    volumes:
      - haggle-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haggle"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  haggle-db:

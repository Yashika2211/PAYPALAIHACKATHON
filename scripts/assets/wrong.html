<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;height:100vh;background:linear-gradient(#cfe3f1,#e9f1f4 55%,#9a8f80 55%);display:grid;place-items:end center;font-family:Helvetica}
.door{width:300px;height:430px;background:#5b3a26;margin-bottom:60px;border:10px solid #3f2819;position:relative}
.door:after{content:"";position:absolute;right:26px;top:210px;width:14px;height:14px;border-radius:50%;background:#d7b46a}
.mat{width:360px;height:30px;background:#6f6a3d;margin:-60px auto 30px;position:relative;top:0}
</style></head><body><div><div class="door"></div><div class="mat"></div></div></body></html>

# Render Blueprint. Deploy: Render Dashboard → New → Blueprint → pick this repo,
# then fill the `sync: false` secrets when prompted.
#
# Defaults to Render's FREE plans (no card needed):
#   - free web services sleep after 15 min idle; the first request (or PayPal webhook) wakes it in ~30-60 s
#   - free Postgres expires 30 days after creation
#   - no cron on free: the web service sweeps expired mandates / stale holds itself (instrumentation.ts)
# For judging, upgrade to always-on: set web `plan: starter`, database `plan: basic-256mb`,
# and optionally uncomment the cron job below (then set HOLD_SWEEP=off on the web service).

envVarGroups:
  - name: haggle-secrets
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: SANDBOX_BUYER_EMAIL
        sync: false
      - key: SANDBOX_PLATFORM_EMAIL
        sync: false
      - key: SANDBOX_MERCHANT_EMAILS
        sync: false
      - key: MANDATE_SIGNING_SECRET
        generateValue: true
      - key: PAYPAL_ENV
        value: sandbox
      - key: LLM_PROVIDER
        value: google
      - key: DEMO_MODE
        value: "true"
      - key: NODE_VERSION
        value: "22"

services:
  - type: web
    name: haggle
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Migrations are idempotent and seeding skips a non-empty database, so this is safe on every start.
    startCommand: pnpm db:migrate && pnpm db:seed && pnpm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: haggle-db
          property: connectionString
      - fromGroup: haggle-secrets

  # Paid plans only. Expires lapsed mandates and releases holds that waited too long for delivery.
  # - type: cron
  #   name: haggle-expire-holds
  #   runtime: node
  #   plan: starter
  #   region: oregon
  #   schedule: "*/30 * * * *"
  #   buildCommand: corepack enable && pnpm install --frozen-lockfile
  #   startCommand: pnpm cron:expire
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: haggle-db
  #         property: connectionString
  #     - fromGroup: haggle-secrets

databases:
  - name: haggle-db
    plan: free
    region: oregon
    databaseName: haggle
    user: haggle
    postgresMajorVersion: "16"
